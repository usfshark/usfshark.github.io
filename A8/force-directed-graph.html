<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D3 Force-Directed Graph</title>
    
    <script src="https://d3js.org/d3.v7.min.js"></script>
    
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .title {
            font-size: 20px;
            font-weight: bold;
        }
        
        .node {
            fill: #5096d0;
            stroke: #fff;
            stroke-width: 1.5px;
            cursor: pointer;
        }
        
        .node:hover {
            fill: #ff7f0e;
        }

        .link {
            stroke: #999;
            stroke-opacity: 0.6;
        }

        .node-label {
            font-size: 10px;
        }
    </style>
</head>
<body>
    <div id="chart-container"></div>

    <script>
        /** Code written originally using past classwork and Observable
         * D3 examples, specifically force-directed node-link graph example. */

        // set up container with margins
        const svgWidth = 900;
        const svgHeight = 600; 
        const margin = { 
            top: 50, 
            right: 50,
            bottom: 50, 
            left: 50 
        };
        const width = svgWidth - margin.left - margin.right;
        const height = svgHeight - margin.top - margin.bottom;

        const svg = d3.select("#chart-container")
            .append("svg")
            .attr("width", svgWidth)
            .attr("height", svgHeight)
            .append("g")
            .attr("transform", `translate(${margin.left},${margin.top})`);

        // read data
        d3.csv("soc-firm-hi-tech.csv").then(function(data) {
            
            // make map of nodes based on IDs
            const nodesMap = new Map();
            data.forEach(d => {
                // only add unique IDs
                nodesMap.set(d.source, { id: d.source });
                nodesMap.set(d.target, { id: d.target });
            });
            const nodes = Array.from(nodesMap.values());

            // add links
            const links = data.map(d => ({
                source: d.source,
                target: d.target,
                weight: +d.weight
            }));

            // set up simulation
            const simulation = d3.forceSimulation(nodes)
                .force("link", d3.forceLink(links).id(d => d.id))
                .force("charge", d3.forceManyBody())
                .force("center", d3.forceCenter(width / 2, height / 2))
                .on("tick", ticked);

            // draw links
            const link = svg.append("g")
                .selectAll("line")
                .data(links)
                .enter()
                .append("line")
                .attr("class", "link")
                .attr("stroke-width", d => Math.sqrt(d.weight));

            // draw nodes
            const node = svg.append("g")
                .selectAll("circle")
                .data(nodes)
                .enter()
                .append("circle")
                .attr("class", "node")
                .attr("r", 8)
                // Add drag behavior
                .call(d3.drag()
                    .on("start", dragstarted)
                    .on("drag", dragged)
                    .on("end", dragended));

            // draw labels
            const label = svg.append("g")
                .selectAll("text")
                .data(nodes)
                .enter()
                .append("text")
                .attr("class", "node-label")
                .attr("dx", 12)
                .attr("dy", ".35em")
                .text(d => d.id);

            // title
            svg.append("text")
                .attr("class", "title")
                .attr("text-anchor", "middle")
                .attr("x", width / 2)
                .attr("y", -10) 
                .text("Hi-Tech Firm Social Network");

            // update on ticks
            function ticked() {
                link
                    .attr("x1", d => d.source.x)
                    .attr("y1", d => d.source.y)
                    .attr("x2", d => d.target.x)
                    .attr("y2", d => d.target.y);

                node
                    .attr("cx", d => d.x)
                    .attr("cy", d => d.y);
                    
                label
                    .attr("x", d => d.x)
                    .attr("y", d => d.y);
            }

            // drag functions
            function dragstarted(event, d) {
                if (!event.active) simulation.alphaTarget(0.3).restart();
                d.fx = d.x;
                d.fy = d.y;
            }

            function dragged(event, d) {
                d.fx = event.x;
                d.fy = event.y;
            }

            function dragended(event, d) {
                if (!event.active) simulation.alphaTarget(0);
                d.fx = null;
                d.fy = null;
            }
        });
    </script>
</body>
</html>
