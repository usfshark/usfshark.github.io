<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D3 Pokémon Stats Over Generations</title>
    
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3-legend/2.25.6/d3-legend.min.js"></script>
    
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .axis-x path,
        .axis-y path {
            fill: none;
            stroke: black;
            shape-rendering: crispEdges;
        }

        .axis-x .tick line,
        .axis-y .tick line {
            stroke: #858585;
        }

        .axis text {
            font-size: 12px;
        }
        
        .axis-label {
            font-size: 14px;
            font-weight: bold;
        }

        .title {
            font-size: 20px;
            font-weight: bold;
        }
        
        .legendTitle {
            font-size: 14px;
            font-weight: bold;
        }
        
        .line {
            fill: none;
            stroke-width: 2.5px;
        }
    </style>
</head>
<body>
    <div id="chart-container"></div>

    <script>
        /** Written originally using past assignments as guides.
         * Two outside references were used for guidance on portions,
         * and are cited where they appear.
         * */

        // set up container with margins
        const svgWidth = 900;
        const svgHeight = 600; 
        const margin = { 
            top: 50, 
            right: 150,
            bottom: 50, 
            left: 70 
        };
        const width = svgWidth - margin.left - margin.right;
        const height = svgHeight - margin.top - margin.bottom;

        const svg = d3.select("#chart-container")
            .append("svg")
            .attr("width", svgWidth)
            .attr("height", svgHeight)
            .append("g")
            .attr("transform", `translate(${margin.left},${margin.top})`);

        // read data
        d3.csv("pokemon.csv").then(function(data) {
            
            data.forEach(d => {
                d.generation_id = +d.generation_id;
                d.hp = +d.hp;
                d.attack = +d.attack;
                d.defense = +d.defense;
                d.speed = +d.speed;
            });

            // get averages using rollup
            // written using example at https://www.geeksforgeeks.org/javascript/d3-js-rollup-method/
            const genDataMap = d3.rollup(data, 
                v => ({
                    generation_id: v[0].generation_id,
                    HP: d3.mean(v, d => d.hp),
                    Attack: d3.mean(v, d => d.attack),
                    Defense: d3.mean(v, d => d.defense),
                    Speed: d3.mean(v, d => d.speed)
                }), 
                d => d.generation_id
            );
            // convert map to array
            const avgData = Array.from(genDataMap.values()).sort((a, b) => a.generation_id - b.generation_id);

            // restructure data for easier access
            // written using reference: https://observablehq.com/@stuartathompson/the-difference-between-d3-nest-d3-map-and-data-map
            const stats = ["HP", "Attack", "Defense", "Speed"];
            const lineData = stats.map(statName => {
                return {
                    stat: statName,
                    values: avgData.map(d => ({
                        generation: d.generation_id,
                        average: d[statName]
                    }))
                };
            });

            // define scale of x axis
            const minGen = d3.min(avgData, d => d.generation_id);
            const maxGen = d3.max(avgData, d => d.generation_id);
            
            const x = d3.scaleLinear()
                .domain([minGen, maxGen])
                .range([0, width]);

            // define scale of y axis
            const maxAverage = d3.max(lineData, d => d3.max(d.values, v => v.average));
            
            const y = d3.scaleLinear()
                .domain([0, maxAverage])
                .nice()
                .range([height, 0]);

            // color scale
            const colorScale = d3.scaleOrdinal(d3.schemeCategory10)
                .domain(stats);

            // x axis
            svg.append("g")
                .attr("class", "axis axis-x")
                .attr("transform", `translate(0, ${height})`)
                .call(d3.axisBottom(x)
                    .ticks(maxGen - minGen) 
                    .tickFormat(d3.format("d"))); // integer ticks only

            // y-axis
            svg.append("g")
                .attr("class", "axis axis-y")
                .call(d3.axisLeft(y));

            // define lines
            const lines = d3.line()
                .x(d => x(d.generation))
                .y(d => y(d.average));

            // draw lines
            svg.selectAll(".line")
                .data(lineData)
                .enter()
                .append("path")
                .attr("class", "line")
                .attr("d", d => lines(d.values))
                .style("stroke", d => colorScale(d.stat));
                
            // x axis label
            svg.append("text")
                .attr("class", "axis-label")
                .attr("text-anchor", "middle")
                .attr("x", width / 2)
                .attr("y", height + margin.bottom - 10)
                .text("Generation");

            // y axis label
            svg.append("text")
                .attr("class", "axis-label")
                .attr("text-anchor", "middle")
                .attr("transform", "rotate(-90)")
                .attr("y", -margin.left + 20)
                .attr("x", -height / 2)
                .text("Average Stat Value");
                
            // title
            svg.append("text")
                .attr("class", "title")
                .attr("text-anchor", "middle")
                .attr("x", width / 2)
                .attr("y", -margin.top / 2) 
                .text("Average Pokémon Stats Over Generations");

            // define legend
            svg.append("g")
                .attr("class", "legendOrdinal")
                .attr("transform", `translate(${width + 20}, 20)`);

            const legendOrdinal = d3.legendColor()
                .shape("path", d3.symbol().type(d3.symbolCircle).size(150)())
                .shapePadding(10)
                .scale(colorScale)
                .title("Stat Types");

            // render legend
            svg.select(".legendOrdinal")
                .call(legendOrdinal);
        });
    </script>
</body>
</html>
