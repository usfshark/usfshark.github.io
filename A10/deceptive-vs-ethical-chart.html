<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D3 Misleading vs. Ethical Data</title>
    
    <script src="https://d3js.org/d3.v7.min.js"></script>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        h2 {
            margin-top: 40px;
            color: #333;
        }

        .axis-x path,
        .axis-y path {
            fill: none;
            stroke: black;
            shape-rendering: crispEdges;
        }

        .axis-x .tick line,
        .axis-y .tick line {
            stroke: #858585;
        }

        .axis text {
            font-size: 12px;
        }
        
        .axis-label {
            font-size: 14px;
            font-weight: bold;
        }

        .title {
            font-size: 20px;
            font-weight: bold;
        }
        
        .line {
            fill: none;
            stroke-width: 3px;
            stroke: #4777cc
        }

        .dot {
            stroke-width: 2px;
            fill: #4777cc;
            stroke: #4777cc
        }

        .grid line {
            stroke: #e0e0e0;
            stroke-dasharray: 4;
        }
        .grid path {
            stroke-width: 0;
        }
    </style>
</head>
<body>
    <h1>
        A10: Deceptive vs Ethical Chart (Going for C Grade)
    </h1>

    <h2>
        Deceptive Chart
    </h2>
    <div id="deceptive-container"></div>

    <h2>
        Ethical Chart
    </h2>
    <div id="ethical-container"></div>

    <script>
        /** Code written originally using past classwork and D3 examples. 
         * No other references were used for the code in this file, so nothing is cited. */

        // set up container with margins
        const svgWidth = 900;
        const svgHeight = 450; 
        const margin = { top: 50, right: 50, bottom: 50, left: 70 };
        const width = svgWidth - margin.left - margin.right;
        const height = svgHeight - margin.top - margin.bottom;

        // read data
        d3.csv("data.csv").then(function(data) {
            
            data.forEach(d => {
                d.cups = +d.cups;
                d.score = +d.score;
            });

            // DECEPTIVE CHART
            
            // deceptive chart ends at 4 cups
            const deceptiveData = data.filter(d => d.cups <= 4);

            const svgDeceptive = d3.select("#deceptive-container")
                .append("svg")
                .attr("width", svgWidth)
                .attr("height", svgHeight)
                .append("g")
                .attr("transform", `translate(${margin.left},${margin.top})`);

            // define scale of x axis
            const xDeceptive = d3.scaleLinear()
                .domain([d3.min(deceptiveData, d => d.cups), d3.max(deceptiveData, d => d.cups)])
                .range([0, width]);

            // define scale of y axis
            const yDeceptive = d3.scaleLinear()
                .domain([60, 100])
                .range([height, 0]);

            // grid lines for y axis
            svgDeceptive.append("g")
                .attr("class", "grid")
                .call(d3.axisLeft(yDeceptive)
                    .tickSize(-width)
                    .tickFormat("")
                );

            // x axis
            svgDeceptive.append("g")
                .attr("class", "axis axis-x")
                .attr("transform", `translate(0, ${height})`)
                .call(d3.axisBottom(xDeceptive).ticks(3).tickFormat(d3.format("d")));

            // y axis
            svgDeceptive.append("g")
                .attr("class", "axis axis-y")
                .call(d3.axisLeft(yDeceptive));

            // line
            const lineDeceptive = d3.line()
                .x(d => xDeceptive(d.cups))
                .y(d => yDeceptive(d.score));

            svgDeceptive.append("path")
                .datum(deceptiveData)
                .attr("class", "line")
                .attr("d", lineDeceptive)
            
            // dots
            svgDeceptive.selectAll(".dot")
                .data(deceptiveData)
                .enter().append("circle")
                .attr("class", "dot")
                .attr("cx", d => xDeceptive(d.cups))
                .attr("cy", d => yDeceptive(d.score))
                .attr("r", 5)

            // axis labels
            svgDeceptive.append("text")
                .attr("class", "axis-label")
                .attr("text-anchor", "middle")
                .attr("x", width / 2)
                .attr("y", height + margin.bottom - 10)
                .text("Cups of Coffee");

            svgDeceptive.append("text")
                .attr("class", "axis-label")
                .attr("text-anchor", "middle")
                .attr("transform", "rotate(-90)")
                .attr("y", -margin.left + 20)
                .attr("x", -height / 2)
                .text("Test Score (%)");
                
            // title
            svgDeceptive.append("text")
                .attr("class", "title")
                .attr("text-anchor", "middle")
                .attr("x", width / 2)
                .attr("y", -margin.top / 2 + 10) 
                .text("Skyrocketing Success: How Coffee Boosts Test Scores!");


            // ETHICAL CHART
            const svgEthical = d3.select("#ethical-container")
                .append("svg")
                .attr("width", svgWidth)
                .attr("height", svgHeight)
                .append("g")
                .attr("transform", `translate(${margin.left},${margin.top})`);

            // define scale for x axis
            const xEthical = d3.scaleLinear()
                .domain([d3.min(data, d => d.cups), d3.max(data, d => d.cups)])
                .range([0, width]);

            // define scale for y axis
            const yEthical = d3.scaleLinear()
                .domain([0, 100])
                .range([height, 0]);

            // grid lines for y axis
            svgEthical.append("g")
                .attr("class", "grid")
                .call(d3.axisLeft(yEthical)
                    .tickSize(-width)
                    .tickFormat("")
                );

            // x axis 
            svgEthical.append("g")
                .attr("class", "axis axis-x")
                .attr("transform", `translate(0, ${height})`)
                .call(d3.axisBottom(xEthical).ticks(data.length - 1).tickFormat(d3.format("d")));

            // y axis
            svgEthical.append("g")
                .attr("class", "axis axis-y")
                .call(d3.axisLeft(yEthical));

            // line
            const lineEthical = d3.line()
                .x(d => xEthical(d.cups))
                .y(d => yEthical(d.score));

            svgEthical.append("path")
                .datum(data)
                .attr("class", "line")
                .attr("d", lineEthical)
            
            // dots
            svgEthical.selectAll(".dot")
                .data(data)
                .enter().append("circle")
                .attr("class", "dot")
                .attr("cx", d => xEthical(d.cups))
                .attr("cy", d => yEthical(d.score))
                .attr("r", 5)

            // axis labels
            svgEthical.append("text")
                .attr("class", "axis-label")
                .attr("text-anchor", "middle")
                .attr("x", width / 2)
                .attr("y", height + margin.bottom - 10)
                .text("Cups of Coffee");

            svgEthical.append("text")
                .attr("class", "axis-label")
                .attr("text-anchor", "middle")
                .attr("transform", "rotate(-90)")
                .attr("y", -margin.left + 20)
                .attr("x", -height / 2)
                .text("Test Score (%)");
                
            // title
            svgEthical.append("text")
                .attr("class", "title")
                .attr("text-anchor", "middle")
                .attr("x", width / 2)
                .attr("y", -margin.top / 2 + 10) 
                .text("The Impact of Coffee on Test Scores");

        });
    </script>
</body>
</html>
