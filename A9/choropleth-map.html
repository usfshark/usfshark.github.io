<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>US County Population</title>
    
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3-legend/2.25.6/d3-legend.min.js"></script>
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
        }

        .header {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            text-align: center;
        }

        .title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 14px;
            color: #666;
        }

        #chart-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        svg {
            width: 100%;
            height: 100%;
            max-height: 100vh;
        }

        .county {
            cursor: pointer;
        }

        .county:hover {
            stroke: #000;
            stroke-width: 1.5px;
            opacity: 0.8;
        }

        .states {
            fill: none;
            stroke: #fff;
            stroke-width: 1.2px;
            stroke-linejoin: round;
        }

        .legendTitle {
            font-size: 14px;
            font-weight: bold;
        }
        
        .label {
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">US Population by County</div>
    </div>
    <div id="chart-container"></div>

    <script>
        /** 
         * Code written originally using D3 observable example library,
         * D3 documentation on new concepts,
         * and one stack overflow post for promise.all, cited where it is used.
        */

        const width = 1150;
        const height = 625;

        const svg = d3.select("#chart-container").append("svg")
            .attr("viewBox", [0, 0, width, height]); // need to use a viewbox with topojson

        /** 
         * Promise.all() functionality learned from D3 documentation and this stack overflow post
         * as reference: https://stackoverflow.com/questions/57381461/
        */
        Promise.all([
            d3.csv("PopulationEstimates.csv"),
            d3.json("https://cdn.jsdelivr.net/npm/us-atlas@3/counties-albers-10m.json")
        ]).then(([csvData, us]) => {
            
            // get data from csv
            const popData = csvData.filter(d => d.Attribute === "CENSUS_2020_POP");
            const valuemap = new Map(popData.map(d => [String(d.FIPStxt).padStart(5, '0'), +d.Value])); // we use padstart in these lines to make sure all are formatted the same
            const namemap = new Map(popData.map(d => [String(d.FIPStxt).padStart(5, '0'), d.Area_Name]));

            const color = d3.scaleQuantile(Array.from(valuemap.values()), d3.schemeGnBu[9]);
            const path = d3.geoPath();

            // draw counties
            svg.append("g")
                .selectAll("path")
                .data(topojson.feature(us, us.objects.counties).features)
                .join("path")
                .attr("class", "county")
                .attr("fill", d => {
                    const val = valuemap.get(d.id);
                    return val === undefined ? "#000000" : color(val); // fill black if no data
                })
                .attr("d", path)

            // draw states
            svg.append("path")
                .datum(topojson.mesh(us, us.objects.states, (a, b) => a !== b))
                .attr("class", "states")
                .attr("d", path);

            // make and display legend
            svg.append("g")
                .attr("class", "legendQuant")
                .attr("transform", "translate(980, 40)");

            const legend = d3.legendColor()
                .labelFormat(d3.format(".2s"))
                .title("2020 Census Reported Population")
                .titleWidth(200)
                .scale(color);

            svg.select(".legendQuant")
                .call(legend);

        });
    </script>
</body>
</html>
